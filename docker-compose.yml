services:
  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"   # only reachable from the host (Nginx proxies to it)
    volumes:
      - ./data:/app/data        # app.db + audio/ + backups/ live here
